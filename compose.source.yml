# Use with: docker compose -f docker-compose.yml -f compose.source.yml up --build -d
services:
  artex:
    image: artex:screenshot-parity-local
    build:
      context: .
      dockerfile: Dockerfile.source
    environment:
      ARTEX_KEY_DIR: /app/private
      ARTEX_CONFIG: /app/private/config.json
    volumes:
      - ./content:/app/content:ro
      - artex-private:/app/private

volumes:
  artex-private:
